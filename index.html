<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra Slim Time Tracker</title>
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    .widget-card {
      width: 100%;
      height: 100%;
      padding: 16px 12px 14px 12px;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      position: relative;
      padding: 0 4px;
    }
    
    /* 좌측 상단 제목과 달력 아이콘 배치 */
    .title-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      color: #2b2b2b;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    /* 노션 가림 방지를 위해 좌측 상단으로 이동한 달력 버튼 */
    .cal-icon-btn {
      border: none;
      background: #e0f2fe;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .cal-icon-btn:hover { background: #bae6fd; }
    .cal-icon-btn svg {
      width: 12px;
      height: 12px;
      stroke: #0284c7;
      stroke-width: 2.2;
      fill: none;
    }

    /* 달력 창 열릴 때 외부 클릭 차단 오버레이 */
    .cal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: transparent;
      z-index: 40;
    }
    .cal-overlay.show { display: block; }

    .calendar-popup {
      display: none;
      position: absolute;
      top: 36px;
      left: -2px;
      right: -2px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 10px 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      z-index: 50;
    }
    .calendar-popup.show { display: block; }

    .cal-header-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding: 0 4px;
    }
    .cal-nav-btn {
      border: none;
      background: transparent;
      color: #64748b;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
    }
    .cal-nav-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    .cal-month-title {
      font-size: 11px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: -0.2px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      align-items: center;
      justify-items: center;
    }
    .cal-day-label {
      font-size: 9px;
      color: #94a3b8;
      font-weight: 600;
      text-align: center;
      margin-bottom: 4px;
      width: 100%;
    }
    .cal-day-label.sun { color: #ef4444; }
    .cal-day-label.sat { color: #3b82f6; }
    
    .cal-date {
      width: 100%;
      aspect-ratio: 1 / 1;
      font-size: 10px;
      font-weight: 600;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: transparent;
      border: none;
      border-radius: 6px;
      position: relative;
      box-sizing: border-box;
    }
    .cal-date:hover { background-color: #f1f5f9; }
    .cal-date.red-day {
      color: #ef4444;
      font-weight: 700;
    }

    .cal-date .heart-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 98%;
      height: 98%;
      z-index: 1;
      pointer-events: none;
    }
    .cal-date .date-text {
      position: relative;
      z-index: 2;
      line-height: 1;
    }
    .cal-date.selected-day .date-text {
      color: #0f172a;
      font-weight: 800;
    }
    .cal-date.selected-day.red-day .date-text {
      color: #dc2626;
      font-weight: 800;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .time-row {
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .hour-label {
      width: 14px;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-align: center;
      flex-shrink: 0;
    }

    .blocks-container {
      display: flex;
      flex: 1;
      height: auto;
      background-color: #ffffff;
      border-radius: 4px;
      overflow: hidden;
      gap: 1px;
    }

    .block {
      flex: 1;
      aspect-ratio: 1 / 1;
      background-color: #f1f5f9;
      cursor: pointer;
      transition: background-color 0.05s;
    }
    .block:hover {
      background-color: #cbd5e1 !important;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal {
      background: white;
      padding: 16px;
      border-radius: 14px;
      width: 210px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 {
      font-size: 12px;
      font-weight: 700;
      color: #1e293b;
    }
    .modal-close-btn {
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 4px;
      line-height: 1;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }
    .modal-close-btn:hover {
      color: #0f172a;
      background: #f1f5f9;
    }

    .modal input[type="text"], .modal select {
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 11px;
      font-family: inherit;
      outline: none;
      width: 100%;
    }
    .color-picker-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .color-picker-row input[type="color"] {
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }
    .color-picker-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker-row input[type="color"]::-webkit-color-swatch {
      border: 1px solid #cbd5e1;
      border-radius: 50%;
    }
    .color-picker-row input[type="text"] {
      flex: 1;
      text-transform: uppercase;
    }

    .modal-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .btn-save {
      background: #38bdf8;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      margin-left: auto;
      transition: background 0.15s;
    }
    .btn-save:hover { background: #0284c7; }
    .btn-delete {
      background: #fef2f2;
      color: #ef4444;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 달력 닫기 전용 외부 클릭 오버레이 -->
  <div class="cal-overlay" id="calOverlay" onclick="closeCalendarPopup()"></div>

  <div class="widget-card">
    <div class="header">
      <div class="title-group">
        <div class="title">Time Tracker</div>
        <button type="button" class="cal-icon-btn" onclick="toggleCalendarPopup(event)" title="달력 보기">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="4" ry="4"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </button>
      </div>

      <div class="calendar-popup" id="calendarPopup">
        <div class="cal-header-nav">
          <button type="button" class="cal-nav-btn" onclick="changeMonth(-1)">&lt;</button>
          <div class="cal-month-title" id="calMonthTitle">2026.09</div>
          <button type="button" class="cal-nav-btn" onclick="changeMonth(1)">&gt;</button>
        </div>
        <div class="cal-grid" id="calGrid">
          <div class="cal-day-label sun">일</div>
          <div class="cal-day-label">월</div>
          <div class="cal-day-label">화</div>
          <div class="cal-day-label">수</div>
          <div class="cal-day-label">목</div>
          <div class="cal-day-label">금</div>
          <div class="cal-day-label sat">토</div>
        </div>
      </div>
    </div>

    <div class="timeline" id="timeline"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modalTitle">일정 추가</h3>
        <button type="button" class="modal-close-btn" onclick="closeModal()" title="닫기">✕</button>
      </div>

      <input type="text" id="taskNameInput" placeholder="일정 이름 (예: 기상, 알바)" />
      
      <div style="display: flex; gap: 4px; align-items: center;">
        <select id="startTimeSelect"></select>
        <span style="font-size: 11px; color: #64748b;">~</span>
        <select id="endTimeSelect"></select>
      </div>

      <div class="color-picker-row">
        <label style="font-size: 11px; color: #475569; font-weight: 600;">색상:</label>
        <input type="color" id="modalColorPicker" value="#38bdf8" onchange="syncColorFromPicker()" />
        <input type="text" id="modalColorCode" value="#38BDF8" maxlength="7" oninput="syncColorFromText()" />
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center;">
        <label style="font-size: 11px; color: #475569; font-weight: 600;">반복:</label>
        <select id="repeatSelect" style="width: auto;">
          <option value="none">없음</option>
          <option value="daily">매일</option>
          <option value="weekday">평일</option>
          <option value="weekend">주말</option>
          <option value="weekly">매주</option>
        </select>
      </div>

      <div class="modal-buttons">
        <button type="button" class="btn-delete" id="btnDelete" onclick="deleteCurrentSchedule()" style="display: none;">삭제</button>
        <button type="button" class="btn-save" onclick="saveSchedule()">저장</button>
      </div>
    </div>
  </div>

  <script>
    const VERCEL_API_URL = '/api/notionapi';

    let DEFAULT_COLOR = '#38bdf8';
    
    const todayObj = new Date();
    let todayStr = getFormattedDate(todayObj);
    let selectedDateStr = todayStr;

    let viewYear = todayObj.getFullYear();
    let viewMonth = todayObj.getMonth(); 
    
    let schedules = [];
    let currentEditId = null;

    let isDragging = false;
    let dragStartIndex = -1;
    let dragEndIndex = -1;

    const timelineEl = document.getElementById('timeline');
    const calendarPopup = document.getElementById('calendarPopup');
    const calOverlay = document.getElementById('calOverlay');
    const modalOverlay = document.getElementById('modalOverlay');

    function getFormattedDate(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getRepeats() {
      const saved = localStorage.getItem('tracker_repeats');
      return saved ? JSON.parse(saved) : [];
    }

    function saveRepeats(repeats) {
      localStorage.setItem('tracker_repeats', JSON.stringify(repeats));
    }

    function loadSchedulesForDate(dateStr) {
      const savedData = localStorage.getItem(`tracker_${dateStr}`);
      let localSchedules = savedData ? JSON.parse(savedData) : [];
      
      const repeats = getRepeats();
      const targetDate = new Date(dateStr);
      const targetDay = targetDate.getDay();
      
      repeats.forEach(rep => {
        if (dateStr >= rep.originDate) {
          let isMatch = false;
          if (rep.repeat === 'daily') isMatch = true;
          else if (rep.repeat === 'weekday' && targetDay >= 1 && targetDay <= 5) isMatch = true;
          else if (rep.repeat === 'weekend' && (targetDay === 0 || targetDay === 6)) isMatch = true;
          else if (rep.repeat === 'weekly') {
            const originDay = new Date(rep.originDate).getDay();
            if (originDay === targetDay) isMatch = true;
          }

          if (isMatch) {
            const exists = localSchedules.some(s => String(s.id) === String(rep.id));
            if (!exists) {
              localSchedules.push({ ...rep });
            }
          }
        }
      });

      return localSchedules;
    }

    function saveSchedulesForDate(dateStr, data) {
      localStorage.setItem(`tracker_${dateStr}`, JSON.stringify(data));
      syncToNotion(dateStr, data);
    }

    // 달력 토글 및 전용 오버레이 처리
    function toggleCalendarPopup(e) {
      if (e) e.stopPropagation();
      const isShow = calendarPopup.classList.toggle('show');
      if (isShow) {
        calOverlay.classList.add('show');
      } else {
        calOverlay.classList.remove('show');
      }
    }

    function closeCalendarPopup() {
      calendarPopup.classList.remove('show');
      calOverlay.classList.remove('show');
    }

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        closeModal();
      }
    });

    document.addEventListener('mouseup', () => {
      if (!isDragging) return;
      isDragging = false;

      const start = Math.min(dragStartIndex, dragEndIndex);
      const end = Math.max(dragStartIndex, dragEndIndex);

      if (calendarPopup.classList.contains('show')) {
        closeCalendarPopup();
        return;
      }

      if (modalOverlay.style.display === 'flex') {
        return;
      }

      if (start !== -1 && end !== -1) {
        if (start === end) {
          const existingSched = schedules.find(s => start >= Number(s.startIdx) && start <= Number(s.endIdx));
          if (existingSched) {
            openEditModal(existingSched.id);
          } else {
            openAddModalWithRange(start, end);
          }
        } else {
          openAddModalWithRange(start, end);
        }
      }
    });

    function isKoreanHoliday(year, month, day, dayOfWeek) {
      if (dayOfWeek === 0) return true;
      const m = month + 1;
      const mmdd = `${String(m).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      
      const solarHolidays = ['01-01', '03-01', '05-05', '06-06', '08-15', '10-03', '10-09', '12-25'];
      if (solarHolidays.includes(mmdd)) return true;

      const lunarHolidays = {
        2024: ['02-09', '02-10', '02-11', '02-12', '05-15', '09-16', '09-17', '09-18'],
        2025: ['01-28', '01-29', '01-30', '05-05', '10-05', '10-06', '10-07', '10-08'],
        2026: ['02-16', '02-17', '02-18', '05-24', '09-24', '09-25', '09-26']
      };

      return lunarHolidays[year] && lunarHolidays[year].includes(mmdd);
    }

    function changeMonth(delta) {
      viewMonth += delta;
      if (viewMonth < 0) {
        viewMonth = 11;
        viewYear--;
      } else if (viewMonth > 11) {
        viewMonth = 0;
        viewYear++;
      }
      renderCalendar();
    }

    function renderCalendar() {
      const calGrid = document.getElementById('calGrid');
      const calMonthTitle = document.getElementById('calMonthTitle');
      
      calMonthTitle.innerText = `${viewYear}.${String(viewMonth + 1).padStart(2, '0')}`;

      const labels = calGrid.querySelectorAll('.cal-day-label');
      calGrid.innerHTML = '';
      labels.forEach(l => calGrid.appendChild(l));

      const firstDay = new Date(viewYear, viewMonth, 1).getDay();
      const totalDays = new Date(viewYear, viewMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-date';
        empty.style.cursor = 'default';
        calGrid.appendChild(empty);
      }

      for (let d = 1; d <= totalDays; d++) {
        const dayOfWeek = (firstDay + d - 1) % 7;
        const dateEl = document.createElement('div');
        dateEl.className = 'cal-date';

        const thisDateStr = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

        if (isKoreanHoliday(viewYear, viewMonth, d, dayOfWeek)) {
          dateEl.classList.add('red-day');
        }

        if (thisDateStr === selectedDateStr) {
          dateEl.classList.add('selected-day');
          const heartSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          heartSvg.setAttribute("class", "heart-icon");
          heartSvg.setAttribute("viewBox", "0 0 24 24");
          heartSvg.setAttribute("fill", "#bae6fd");
          heartSvg.innerHTML = `<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>`;
          dateEl.appendChild(heartSvg);
        }

        const textSpan = document.createElement('span');
        textSpan.className = 'date-text';
        textSpan.innerText = d;
        dateEl.appendChild(textSpan);

        dateEl.onclick = async (e) => {
          e.stopPropagation();
          selectedDateStr = thisDateStr;
          schedules = loadSchedulesForDate(selectedDateStr);
          renderCalendar();
          renderSchedules();
          closeCalendarPopup();
          
          await fetchFromNotion(selectedDateStr);
        };

        calGrid.appendChild(dateEl);
      }
    }

    function buildTimeline() {
      timelineEl.innerHTML = '';
      let globalBlockIndex = 0;

      for (let hour = 6; hour <= 24; hour++) {
        const row = document.createElement('div');
        row.className = 'time-row';

        const label = document.createElement('div');
        label.className = 'hour-label';
        label.innerText = hour;
        row.appendChild(label);

        const blocksContainer = document.createElement('div');
        blocksContainer.className = 'blocks-container';

        for (let m = 0; m < 6; m++) {
          const blockIndex = globalBlockIndex++;
          const block = document.createElement('div');
          block.className = 'block';
          block.dataset.index = blockIndex;

          block.onmousedown = (e) => {
            if (e.button !== 0) return;
            if (calendarPopup.classList.contains('show')) return;
            if (modalOverlay.style.display === 'flex') return;

            isDragging = true;
            dragStartIndex = blockIndex;
            dragEndIndex = blockIndex;
            updateSelectionHighlight(dragStartIndex, dragEndIndex);
          };

          block.onmouseenter = () => {
            if (isDragging) {
              dragEndIndex = blockIndex;
              updateSelectionHighlight(dragStartIndex, dragEndIndex);
            }
          };

          blocksContainer.appendChild(block);
        }

        row.appendChild(blocksContainer);
        timelineEl.appendChild(row);
      }
    }

    function updateSelectionHighlight(startIdx, endIdx) {
      renderSchedules();
      if (startIdx === -1 || endIdx === -1) return;

      const start = Math.min(startIdx, endIdx);
      const end = Math.max(startIdx, endIdx);

      for (let i = start; i <= end; i++) {
        const b = document.querySelector(`.block[data-index="${i}"]`);
        if (b) {
          b.style.backgroundColor = DEFAULT_COLOR;
        }
      }
    }

    function blockIndexToStartTime(idx) {
      const h = Math.floor(idx / 6) + 6;
      const m = (idx % 6) * 10;
      return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    }

    function blockIndexToEndTime(idx) {
      const totalMins = (idx + 1) * 10;
      const h = Math.floor(totalMins / 60) + 6;
      const m = totalMins % 60;
      return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    }

    function renderSchedules() {
      document.querySelectorAll('.block').forEach(b => {
        b.style.backgroundColor = '#f1f5f9';
        b.removeAttribute('title');
      });

      schedules.forEach(sched => {
        const startT = blockIndexToStartTime(Number(sched.startIdx));
        const endT = blockIndexToEndTime(Number(sched.endIdx));
        const tooltip = `${sched.name} (${startT} ~ ${endT})`;

        for (let i = Number(sched.startIdx); i <= Number(sched.endIdx); i++) {
          const block = document.querySelector(`.block[data-index="${i}"]`);
          if (block) {
            block.style.backgroundColor = sched.color;
            block.setAttribute('title', tooltip);
          }
        }
      });
    }

    function saveCurrentSchedules() {
      saveSchedulesForDate(selectedDateStr, schedules);
    }

    function initTimeSelects() {
      const startSel = document.getElementById('startTimeSelect');
      const endSel = document.getElementById('endTimeSelect');
      startSel.innerHTML = '';
      endSel.innerHTML = '';

      const totalBlocks = (25 - 6) * 6;
      for (let i = 0; i < totalBlocks; i++) {
        startSel.innerHTML += `<option value="${i}">${blockIndexToStartTime(i)}</option>`;
        endSel.innerHTML += `<option value="${i}">${blockIndexToEndTime(i)}</option>`;
      }
    }

    function syncColorFromPicker() {
      const color = document.getElementById('modalColorPicker').value;
      document.getElementById('modalColorCode').value = color.toUpperCase();
    }

    function syncColorFromText() {
      const code = document.getElementById('modalColorCode').value;
      if (/^#[0-9A-F]{6}$/i.test(code)) {
        document.getElementById('modalColorPicker').value = code;
      }
    }

    function openAddModalWithRange(startIdx, endIdx) {
      currentEditId = null;
      document.getElementById('modalTitle').innerText = '일정 추가';
      document.getElementById('taskNameInput').value = '';
      document.getElementById('startTimeSelect').value = startIdx;
      document.getElementById('endTimeSelect').value = endIdx;
      document.getElementById('modalColorPicker').value = DEFAULT_COLOR;
      document.getElementById('modalColorCode').value = DEFAULT_COLOR.toUpperCase();
      document.getElementById('repeatSelect').value = 'none';
      document.getElementById('btnDelete').style.display = 'none';
      modalOverlay.style.display = 'flex';
    }

    function openEditModal(scheduleId) {
      const sched = schedules.find(s => String(s.id) === String(scheduleId));
      if (!sched) return;

      currentEditId = scheduleId;
      document.getElementById('modalTitle').innerText = '일정 수정';
      document.getElementById('taskNameInput').value = sched.name;
      document.getElementById('startTimeSelect').value = sched.startIdx;
      document.getElementById('endTimeSelect').value = sched.endIdx;
      document.getElementById('modalColorPicker').value = sched.color;
      document.getElementById('modalColorCode').value = sched.color.toUpperCase();
      document.getElementById('repeatSelect').value = sched.repeat || 'none';
      document.getElementById('btnDelete').style.display = 'block';
      modalOverlay.style.display = 'flex';
    }

    function closeModal() {
      currentEditId = null;
      modalOverlay.style.display = 'none';
      renderSchedules();
    }

    function saveSchedule() {
      const name = document.getElementById('taskNameInput').value.trim() || '새 일정';
      const startIdx = parseInt(document.getElementById('startTimeSelect').value);
      const endIdx = parseInt(document.getElementById('endTimeSelect').value);
      const color = document.getElementById('modalColorPicker').value;
      const repeat = document.getElementById('repeatSelect').value;

      if (startIdx > endIdx) {
        alert('시작 시간이 종료 시간보다 늦을 수 없습니다.');
        return;
      }

      let schedObj;
      if (currentEditId !== null && currentEditId !== undefined) {
        schedObj = schedules.find(s => String(s.id) === String(currentEditId));
        if (schedObj) {
          schedObj.name = name;
          schedObj.startIdx = startIdx;
          schedObj.endIdx = endIdx;
          schedObj.color = color;
          schedObj.repeat = repeat;
        }
      } else {
        schedObj = {
          id: Date.now(),
          name: name,
          startIdx: startIdx,
          endIdx: endIdx,
          color: color,
          repeat: repeat,
          originDate: selectedDateStr
        };
        schedules.push(schedObj);
      }

      let repeats = getRepeats();
      repeats = repeats.filter(r => String(r.id) !== String(schedObj.id));
      if (repeat !== 'none') {
        repeats.push({ ...schedObj, originDate: schedObj.originDate || selectedDateStr });
      }
      saveRepeats(repeats);

      saveCurrentSchedules();
      renderSchedules();
      closeModal();
    }

    function deleteCurrentSchedule() {
      if (currentEditId === null || currentEditId === undefined) return;
      
      const targetId = String(currentEditId);
      schedules = schedules.filter(s => String(s.id) !== targetId);

      let repeats = getRepeats();
      repeats = repeats.filter(r => String(r.id) !== targetId);
      saveRepeats(repeats);

      saveCurrentSchedules();
      renderSchedules();
      closeModal();
    }

    // 요약 문구 생성
    function generateSummaryText(daySchedules) {
      if (!daySchedules || daySchedules.length === 0) return '기록 없음';
      return daySchedules
        .map(s => `• ${s.name} (${blockIndexToStartTime(Number(s.startIdx))} ~ ${blockIndexToEndTime(Number(s.endIdx))})`)
        .join(' ');
    }

    async function fetchFromNotion(targetDateStr) {
      try {
        const res = await fetch(`${VERCEL_API_URL}?date=${targetDateStr}`);
        if (!res.ok) return;
        const data = await res.json();
        
        if (data && Array.isArray(data)) {
          schedules = data;
          localStorage.setItem(`tracker_${targetDateStr}`, JSON.stringify(schedules));
          renderSchedules();
        }
      } catch (e) {
        console.error("노션 불러오기 실패:", e);
      }
    }

    async function syncToNotion(targetDateStr, daySchedules) {
      const summaryText = generateSummaryText(daySchedules);
      try {
        await fetch(VERCEL_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            date: targetDateStr,
            summary: summaryText,
            schedules: daySchedules
          })
        });
      } catch (e) {
        console.error("노션 저장 실패:", e);
      }
    }

    // 초기화
    schedules = loadSchedulesForDate(selectedDateStr);
    renderCalendar();
    buildTimeline();
    initTimeSelects();
    renderSchedules();
    fetchFromNotion(selectedDateStr);
  </script>
</body>
</html>
